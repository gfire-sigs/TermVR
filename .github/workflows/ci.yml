name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Docs, Lockfile, and Script Gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq python3 ripgrep

      - name: Verify ASD-STE100 prose and lockfile parity
        run: |
          set -euo pipefail
          if rg -n $'\u2014| \u2013 |\u2192' README.md AGENTS.md CONTRIBUTING.md CHANGELOG.md docs/ fastlane/ fdroid/; then
            echo "Found forbidden em-dash, spaced en-dash, or prose arrow" >&2
            exit 1
          fi
          slop_matches="$(rg -ni '\b(seamless|seamlessly|robust|battle-tested|cutting-edge|next-generation|state-of-the-art|powerhouse|unleash|empower|supercharge|elevate|delve|tapestry|testament|holistic|synergy|paradigm|under the hood|heavy lifting|effortlessly|meticulously|crucial|pivotal|paramount|game-changer|utilize|utilizes|utilizing|leverage|leverages|leveraging)\b' README.md AGENTS.md CONTRIBUTING.md CHANGELOG.md docs/ fastlane/ fdroid/ || { rc=$?; [ "${rc}" -eq 1 ]; })"
          filtered_slop="$(printf '%s\n' "${slop_matches}" | rg -v '^(AGENTS\.md:[0-9]+:rg -ni |$)' || true)"
          if [ -n "${filtered_slop}" ]; then
            printf '%s\n' "${filtered_slop}"
            echo "Found forbidden AI-slop word" >&2
            exit 1
          fi
          python3 -m json.tool scripts/source-lock.json >/dev/null
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("scripts/source-lock.json").read_text(encoding="utf-8"))
          fdroid_text = Path("fdroid/dev.gfire.termvr.yml").read_text(encoding="utf-8")

          for key, meta in lock["sources"].items():
              commit = meta["commit"]
              assert re.fullmatch(r"[0-9a-f]{40}", commit), f"Invalid 40-hex commit for {key}: {commit}"

          assert not re.search(r"^\s*srclibs:\s*$", fdroid_text, re.M), (
              "fdroid/dev.gfire.termvr.yml must not declare unregistered srclibs"
          )
          ndk_ver = lock["toolchains"]["android_ndk"]
          assert re.search(rf"^\s*ndk:\s*{re.escape(ndk_ver)}\s*$", fdroid_text, re.M), (
              f"NDK version {ndk_ver} mismatch in fdroid/dev.gfire.termvr.yml"
          )
          print("Lockfile and F-Droid metadata verified across all 5 sources and NDK.")
          PY

      - name: Verify gvx version alignment
        run: ./scripts/sync-gvx-version.sh --check

      - name: Verify shell script syntax and executable mode
        run: |
          set -euo pipefail
          for script in \
            scripts/ci-emulator-smoke.sh \
            scripts/provision-toolchains-and-vendor.sh \
            scripts/build-native-deps.sh \
            scripts/sync-gvx-version.sh \
            scripts/verify-16kb-alignment.sh \
            scripts/verify-reproducible-apk.sh
          do
            test -x "${script}"
            bash -n "${script}"
          done

  guest-agent-tests:
    name: Guest Agent Tests and Size Budget
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision pinned Go toolchain
        run: |
          ./scripts/provision-toolchains-and-vendor.sh --toolchains-only

      - name: Run unit tests and enforce static binary size cap
        run: |
          set -euo pipefail
          source .toolchains/env.sh
          cd guest/termvr-agent
          GOTOOLCHAIN=local "${GO_BIN}" test -v ./...
          mkdir -p /tmp/termvr-agent-check
          for arch in arm64 amd64; do
            out="/tmp/termvr-agent-check/termvr-agent-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" GOTOOLCHAIN=local "${GO_BIN}" build \
              -trimpath -buildvcs=false -ldflags="-s -w -buildid=" \
              -o "${out}" ./cmd/termvr-agent
            size_bytes="$(stat -c%s "${out}")"
            echo "termvr-agent (${arch}): ${size_bytes} bytes"
            if [ "${size_bytes}" -gt 2306867 ]; then
              echo "termvr-agent (${arch}) exceeds 2.2 MiB limit" >&2
              exit 1
            fi
          done

  android-build-and-16kb:
    name: Offline Native Build, Gradle Tests, and 16 KB Check
    needs:
      - quality-gates
      - guest-agent-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates cmake curl git jq ninja-build python3 uidmap unzip xz-utils

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >
            platforms;android-36
            build-tools;36.1.0
            ndk;28.0.13004108
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'

      - name: Cache toolchains and upstream sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains
          key: termvr-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/source-lock.json') }}

      - name: Provision toolchains and vendor caches
        run: ./scripts/provision-toolchains-and-vendor.sh

      - name: Compile native dependencies offline
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -r -n ./scripts/build-native-deps.sh --abi arm64-v8a,x86_64

      - name: Run unit tests, lint, and assemble APKs and AAB
        run: |
          set -euo pipefail
          GRADLE_EXE="$(command -v gradle)"
          if [ -x ./gradlew ]; then
            GRADLE_EXE="./gradlew"
          fi
          "${GRADLE_EXE}" --no-daemon :core:model:test testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease -PtermvrAbis=arm64-v8a,x86_64
          test -n "$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"

      - name: Verify 16 KB ELF segment alignment on packaged APKs and AAB
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          RELEASE_AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "${DEBUG_APK}"
          test -n "${RELEASE_APK}"
          test -n "${RELEASE_AAB}"
          ./scripts/verify-16kb-alignment.sh "${DEBUG_APK}" "${RELEASE_APK}" "${RELEASE_AAB}"

      - name: Upload debug APK for emulator smoke check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termvr-smoke-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-16-emulator-16kb:
    name: Android 16 (16 KB x86_64) Smoke Verification
    needs:
      - android-build-and-16kb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download smoke APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termvr-smoke-apks
          path: /tmp/termvr-apks

      - name: Enable KVM group permissions
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
          fi

      - name: Run Android 16 16 KB x86_64 emulator smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/ci-emulator-smoke.sh
