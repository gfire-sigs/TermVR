name: Publish Self-Hosted F-Droid Repo

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish to gh-pages (e.g. v0.18.10022026111600.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to gh-pages (e.g. v0.18.10022026111600.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-fdroid-repo:
    name: Publish Self-Hosted F-Droid Repo (gh-pages)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install fdroidserver (PyPI) and signing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner openjdk-17-jdk-headless openssl python3-venv
          python3 -m venv /tmp/fdroid-venv
          /tmp/fdroid-venv/bin/pip install --quiet --upgrade pip fdroidserver
          echo "/tmp/fdroid-venv/bin" >> "${GITHUB_PATH}"
          /tmp/fdroid-venv/bin/fdroid --version

      - name: Download signed arm64-v8a APK from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "TermVR-${TAG_NAME}-arm64-v8a.apk" \
            --dir release-assets \
            --clobber
          ls -la release-assets

      - name: Build and push F-Droid repo to gh-pages
        env:
          FDROID_REPO_KEYSTORE_B64: ${{ secrets.FDROID_REPO_KEYSTORE_B64 }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
          FDROID_REPO_KEYSTORE_PASS: ${{ secrets.FDROID_REPO_KEYSTORE_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.FDROID_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${FDROID_REPO_KEYSTORE_B64}" ]; then
            echo "FDROID_REPO_KEYSTORE_B64 is not configured; skipping self-hosted F-Droid repo publish."
            exit 0
          fi
          if [ -z "${FDROID_REPO_KEY_ALIAS}" ] || [ -z "${FDROID_REPO_KEYSTORE_PASS}" ]; then
            echo "FDROID_REPO_KEY_ALIAS and FDROID_REPO_KEYSTORE_PASS must be set when FDROID_REPO_KEYSTORE_B64 is present" >&2
            exit 1
          fi

          KEYSTORE_PATH="/tmp/termvr-fdroid-repo.p12"
          PREV_DIR="/tmp/termvr-prev-gh-pages"
          SITE_DIR="/tmp/termvr-gh-pages-site"
          PUSH_DIR="/tmp/termvr-gh-pages-push"
          cleanup() {
            rm -rf "${KEYSTORE_PATH}" "${PREV_DIR}" "${SITE_DIR}" "${PUSH_DIR}"
          }
          trap cleanup EXIT

          printf '%s' "${FDROID_REPO_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"

          AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          AUTH_HEADER="AUTHORIZATION: basic ${AUTH_B64}"
          REPO_GIT_URL="https://github.com/${GITHUB_REPOSITORY}.git"

          # Preserve previous gh-pages APKs if the branch already exists.
          # Run outside the checked-out workspace so actions/checkout's extraheader is not duplicated.
          if git -C /tmp -c "http.https://github.com/.extraheader=${AUTH_HEADER}" ls-remote --exit-code --heads "${REPO_GIT_URL}" gh-pages >/dev/null 2>&1; then
            git -C /tmp -c "http.https://github.com/.extraheader=${AUTH_HEADER}" clone --depth 1 --branch gh-pages "${REPO_GIT_URL}" "${PREV_DIR}"
          fi

          if [ -n "${CUSTOM_DOMAIN}" ]; then
            REPO_URL="https://${CUSTOM_DOMAIN}/fdroid/repo"
          else
            REPO_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/fdroid/repo"
          fi

          ./scripts/publish-fdroid-repo.sh \
            --apk "release-assets/TermVR-${TAG_NAME}-arm64-v8a.apk" \
            --site-dir "${SITE_DIR}" \
            --prev-site-dir "${PREV_DIR}" \
            --keystore "${KEYSTORE_PATH}" \
            --key-alias "${FDROID_REPO_KEY_ALIAS}" \
            --repo-url "${REPO_URL}" \
            --custom-domain "${CUSTOM_DOMAIN}"

          if [ -d "${PREV_DIR}/.git" ]; then
            mv "${PREV_DIR}" "${PUSH_DIR}"
            find "${PUSH_DIR}" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          else
            mkdir -p "${PUSH_DIR}"
            git -C "${PUSH_DIR}" init -b gh-pages
            git -C "${PUSH_DIR}" remote add origin "${REPO_GIT_URL}"
          fi

          cp -a "${SITE_DIR}/." "${PUSH_DIR}/"
          git -C "${PUSH_DIR}" config user.name "github-actions[bot]"
          git -C "${PUSH_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${PUSH_DIR}" add -A
          if ! git -C "${PUSH_DIR}" diff --cached --quiet; then
            git -C "${PUSH_DIR}" commit -m "chore(fdroid-repo): publish TermVR ${TAG_NAME}"
            git -C "${PUSH_DIR}" -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin gh-pages
          fi
