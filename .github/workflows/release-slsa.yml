name: Release SLSA

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Deterministic APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apksigcopier ca-certificates cmake curl diffoscope git jq ninja-build python3 uidmap unzip xz-utils

      - name: Verify lockfile and F-Droid parity
        run: |
          set -euo pipefail
          python3 -m json.tool scripts/source-lock.json >/dev/null
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("scripts/source-lock.json").read_text(encoding="utf-8"))
          fdroid_text = Path("fdroid/dev.gfire.termvr.yml").read_text(encoding="utf-8")
          for key, meta in lock["sources"].items():
              assert re.fullmatch(r"[0-9a-f]{40}", meta["commit"]), f"Invalid commit for {key}"
          assert not re.search(r"^\s*srclibs:\s*$", fdroid_text, re.M), "Unregistered srclibs present"
          ndk_ver = lock["toolchains"]["android_ndk"]
          assert re.search(rf"^\s*ndk:\s*{re.escape(ndk_ver)}\s*$", fdroid_text, re.M), (
              f"NDK version {ndk_ver} mismatch in fdroid/dev.gfire.termvr.yml"
          )
          PY

      - name: Verify gvx version alignment against release tag
        run: ./scripts/sync-gvx-version.sh --check --expect-tag "${GITHUB_REF_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >
            platforms;android-36
            build-tools;36.1.0
            ndk;28.0.13004108
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'

      - name: Provision toolchains and vendor caches
        run: ./scripts/provision-toolchains-and-vendor.sh

      - name: Build offline native dependencies and unsigned release APK
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -r -n ./scripts/build-native-deps.sh --abi "${{ matrix.abi }}"
          GRADLE_EXE="$(command -v gradle)"
          if [ -x ./gradlew ]; then
            GRADLE_EXE="./gradlew"
          fi
          "${GRADLE_EXE}" --no-daemon :app:assembleRelease "-PtermvrAbis=${{ matrix.abi }}"

          BUILT_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "${BUILT_APK}"
          cp -f "${BUILT_APK}" "/tmp/unsigned-${{ matrix.abi }}.apk"

      - name: Verify clean-room unsigned APK reproducibility
        run: |
          set -euo pipefail
          CLEAN_DIR="/tmp/termvr-clean-repro-${{ matrix.abi }}"
          rm -rf "${CLEAN_DIR}"
          mkdir -p "${CLEAN_DIR}"
          git archive --format=tar HEAD | tar -xf - -C "${CLEAN_DIR}"
          ln -s "${PWD}/.toolchains" "${CLEAN_DIR}/.toolchains"
          GRADLE_EXE="$(command -v gradle)"
          if [ -x ./gradlew ]; then
            GRADLE_EXE="${CLEAN_DIR}/gradlew"
          fi
          (
            cd "${CLEAN_DIR}"
            unshare -r -n ./scripts/build-native-deps.sh --abi "${{ matrix.abi }}"
            "${GRADLE_EXE}" --no-daemon :app:assembleRelease "-PtermvrAbis=${{ matrix.abi }}"
          )
          CLEAN_APK="$(find "${CLEAN_DIR}/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"
          test -n "${CLEAN_APK}"
          cp -f "${CLEAN_APK}" "/tmp/clean-unsigned-${{ matrix.abi }}.apk"
          ./scripts/verify-reproducible-apk.sh \
            --unsigned-a "/tmp/unsigned-${{ matrix.abi }}.apk" \
            --unsigned-b "/tmp/clean-unsigned-${{ matrix.abi }}.apk"
          rm -rf "${CLEAN_DIR}"

      - name: Sign release APK and verify apksigcopier reproducibility
        env:
          TERMVR_RELEASE_KEYSTORE_B64: ${{ secrets.TERMVR_RELEASE_KEYSTORE_B64 }}
          TERMVR_RELEASE_KEY_ALIAS: ${{ secrets.TERMVR_RELEASE_KEY_ALIAS }}
          TERMVR_RELEASE_KEYSTORE_PASS: ${{ secrets.TERMVR_RELEASE_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          ABI="${{ matrix.abi }}"
          TAG_NAME="${GITHUB_REF_NAME}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="${SDK_ROOT}/build-tools/36.1.0/apksigner"
          UNSIGNED_APK="/tmp/unsigned-${ABI}.apk"
          CLEAN_UNSIGNED_APK="/tmp/clean-unsigned-${ABI}.apk"
          REPRO_SIGNED_APK="/tmp/repro-signed-${ABI}.apk"
          KEYSTORE_PATH="/tmp/termvr-release-${ABI}.p12"
          OUT_APK="dist/TermVR-${TAG_NAME}-${ABI}.apk"

          cleanup() {
            rm -f "${KEYSTORE_PATH}" "${UNSIGNED_APK}" "${CLEAN_UNSIGNED_APK}" "${REPRO_SIGNED_APK}"
          }
          trap cleanup EXIT

          mkdir -p dist

          if [ -n "${TERMVR_RELEASE_KEYSTORE_B64}" ]; then
            if [ -z "${TERMVR_RELEASE_KEY_ALIAS}" ] || [ -z "${TERMVR_RELEASE_KEYSTORE_PASS}" ]; then
              echo "TERMVR_RELEASE_KEY_ALIAS and TERMVR_RELEASE_KEYSTORE_PASS must be set when TERMVR_RELEASE_KEYSTORE_B64 is present" >&2
              exit 1
            fi
            printf '%s' "${TERMVR_RELEASE_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_PATH}"
            KEY_ALIAS="${TERMVR_RELEASE_KEY_ALIAS}"
            export SIGNING_PASS="${TERMVR_RELEASE_KEYSTORE_PASS}"
          else
            echo "TERMVR_RELEASE_KEYSTORE_B64 is empty; generating ephemeral fallback keystore in /tmp"
            KEY_ALIAS="termvr-ephemeral"
            export SIGNING_PASS="termvr-ephemeral-$(date +%s)-$$"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "${KEYSTORE_PATH}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 4096 -validity 365 \
              -dname "CN=TermVR Ephemeral Fork Build, OU=Android, O=gfire-sigs" \
              -storepass "${SIGNING_PASS}" \
              -keypass "${SIGNING_PASS}"
          fi

          "${APKSIGNER}" sign \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --alignment-preserved true \
            --ks "${KEYSTORE_PATH}" \
            --ks-type PKCS12 \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:SIGNING_PASS \
            --key-pass env:SIGNING_PASS \
            --out "${OUT_APK}" \
            "${UNSIGNED_APK}"

          "${APKSIGNER}" verify --verbose --print-certs "${OUT_APK}"

          apksigcopier copy "${OUT_APK}" "${CLEAN_UNSIGNED_APK}" "${REPRO_SIGNED_APK}"
          SHA_OUT="$(sha256sum "${OUT_APK}" | awk '{print tolower($1)}')"
          SHA_REPRO="$(sha256sum "${REPRO_SIGNED_APK}" | awk '{print tolower($1)}')"
          echo "Signed APK SHA-256:       ${SHA_OUT}"
          echo "apksigcopier APK SHA-256: ${SHA_REPRO}"
          if [ "${SHA_OUT}" != "${SHA_REPRO}" ]; then
            diffoscope "${OUT_APK}" "${REPRO_SIGNED_APK}" || true
            echo "apksigcopier signature transfer mismatch: ${SHA_OUT} != ${SHA_REPRO}" >&2
            exit 1
          fi

      - name: Verify 16 KB ELF alignment
        run: |
          ./scripts/verify-16kb-alignment.sh "dist/TermVR-${GITHUB_REF_NAME}-${{ matrix.abi }}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk-${{ matrix.abi }}
          path: dist/TermVR-${{ github.ref_name }}-${{ matrix.abi }}.apk

  build-aab:
    name: Build Universal AAB and Accrescent APKS (arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates cmake curl git jq ninja-build python3 uidmap unzip xz-utils

      - name: Verify gvx version alignment against release tag
        run: ./scripts/sync-gvx-version.sh --check --expect-tag "${GITHUB_REF_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >
            platforms;android-36
            build-tools;36.1.0
            ndk;28.0.13004108
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'

      - name: Provision toolchains and vendor caches
        run: ./scripts/provision-toolchains-and-vendor.sh

      - name: Build offline native dependencies and release AAB
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -r -n ./scripts/build-native-deps.sh --abi arm64-v8a,x86_64
          GRADLE_EXE="$(command -v gradle)"
          if [ -x ./gradlew ]; then
            GRADLE_EXE="./gradlew"
          fi
          "${GRADLE_EXE}" --no-daemon :app:bundleRelease -PtermvrAbis=arm64-v8a,x86_64
          BUILT_AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "${BUILT_AAB}"
          cp -f "${BUILT_AAB}" "/tmp/unsigned-universal.aab"

      - name: Sign AAB and build signed Accrescent APKS
        env:
          TERMVR_RELEASE_KEYSTORE_B64: ${{ secrets.TERMVR_RELEASE_KEYSTORE_B64 }}
          TERMVR_RELEASE_KEY_ALIAS: ${{ secrets.TERMVR_RELEASE_KEY_ALIAS }}
          TERMVR_RELEASE_KEYSTORE_PASS: ${{ secrets.TERMVR_RELEASE_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          umask 077
          TAG_NAME="${GITHUB_REF_NAME}"
          UNSIGNED_AAB="/tmp/unsigned-universal.aab"
          KEYSTORE_PATH="/tmp/termvr-release-aab.p12"
          PASS_FILE="/tmp/termvr-release-aab.pass"
          BUNDLETOOL_JAR="/tmp/bundletool-all.jar"
          OUT_AAB="dist/TermVR-${TAG_NAME}.aab"
          OUT_APKS="dist/TermVR-${TAG_NAME}.apks"

          cleanup() {
            rm -f "${KEYSTORE_PATH}" "${PASS_FILE}" "${UNSIGNED_AAB}" "${BUNDLETOOL_JAR}"
          }
          trap cleanup EXIT

          mkdir -p dist

          if [ -n "${TERMVR_RELEASE_KEYSTORE_B64}" ]; then
            if [ -z "${TERMVR_RELEASE_KEY_ALIAS}" ] || [ -z "${TERMVR_RELEASE_KEYSTORE_PASS}" ]; then
              echo "TERMVR_RELEASE_KEY_ALIAS and TERMVR_RELEASE_KEYSTORE_PASS must be set when TERMVR_RELEASE_KEYSTORE_B64 is present" >&2
              exit 1
            fi
            printf '%s' "${TERMVR_RELEASE_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_PATH}"
            KEY_ALIAS="${TERMVR_RELEASE_KEY_ALIAS}"
            export SIGNING_PASS="${TERMVR_RELEASE_KEYSTORE_PASS}"
          else
            echo "TERMVR_RELEASE_KEYSTORE_B64 is empty; generating ephemeral fallback keystore in /tmp"
            KEY_ALIAS="termvr-ephemeral"
            export SIGNING_PASS="termvr-ephemeral-$(date +%s)-$$"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "${KEYSTORE_PATH}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 4096 -validity 365 \
              -dname "CN=TermVR Ephemeral Fork Build, OU=Android, O=gfire-sigs" \
              -storepass "${SIGNING_PASS}" \
              -keypass "${SIGNING_PASS}"
          fi
          printf '%s' "${SIGNING_PASS}" > "${PASS_FILE}"

          jarsigner \
            -keystore "${KEYSTORE_PATH}" \
            -storetype PKCS12 \
            -storepass:env SIGNING_PASS \
            -keypass:env SIGNING_PASS \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar "${OUT_AAB}" \
            "${UNSIGNED_AAB}" \
            "${KEY_ALIAS}"

          VERIFY_OUT="$(jarsigner -verify -verbose:summary \
            -keystore "${KEYSTORE_PATH}" \
            -storetype PKCS12 \
            -storepass:env SIGNING_PASS \
            "${OUT_AAB}")"
          printf '%s\n' "${VERIFY_OUT}"
          printf '%s\n' "${VERIFY_OUT}" | grep -Fq "jar verified."

          BUNDLETOOL_VER="$(jq -r '.toolchains.bundletool' scripts/source-lock.json)"
          BUNDLETOOL_SHA256="$(jq -r '.toolchains.bundletool_sha256' scripts/source-lock.json)"
          curl -fsSL "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VER}/bundletool-all-${BUNDLETOOL_VER}.jar" \
            -o "${BUNDLETOOL_JAR}"
          printf '%s  %s\n' "${BUNDLETOOL_SHA256}" "${BUNDLETOOL_JAR}" | sha256sum -c -

          java -jar "${BUNDLETOOL_JAR}" build-apks \
            --bundle="${UNSIGNED_AAB}" \
            --output="${OUT_APKS}" \
            --ks="${KEYSTORE_PATH}" \
            --ks-key-alias="${KEY_ALIAS}" \
            --ks-pass="file:${PASS_FILE}" \
            --key-pass="file:${PASS_FILE}"

          # Verify every split APK inside the Accrescent APKS archive.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="${SDK_ROOT}/build-tools/36.1.0/apksigner"
          SPLIT_TMP="$(mktemp -d /tmp/termvr-apks-verify.XXXXXX)"
          unzip -q "${OUT_APKS}" 'splits/*.apk' -d "${SPLIT_TMP}"
          for split_apk in "${SPLIT_TMP}"/splits/*.apk; do
            "${APKSIGNER}" verify --min-sdk-version 31 "${split_apk}"
          done
          rm -rf "${SPLIT_TMP}"

      - name: Verify 16 KB ELF alignment inside AAB and APKS
        run: |
          ./scripts/verify-16kb-alignment.sh \
            "dist/TermVR-${GITHUB_REF_NAME}.aab" \
            "dist/TermVR-${GITHUB_REF_NAME}.apks"

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-aab
          path: dist/TermVR-${{ github.ref_name }}.aab

      - name: Upload release APKS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apks
          path: dist/TermVR-${{ github.ref_name }}.apks

  attest-and-release:
    name: Attest SLSA Provenance and Publish Release
    needs:
      - build-apks
      - build-aab
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download arm64-v8a APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk-arm64-v8a
          path: release-assets

      - name: Download x86_64 APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk-x86_64
          path: release-assets

      - name: Download universal AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-aab
          path: release-assets

      - name: Download Accrescent APKS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apks
          path: release-assets

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            "TermVR-${GITHUB_REF_NAME}-arm64-v8a.apk" \
            "TermVR-${GITHUB_REF_NAME}-x86_64.apk" \
            "TermVR-${GITHUB_REF_NAME}.apks" \
            "TermVR-${GITHUB_REF_NAME}.aab" > SHA256SUMS
          cat SHA256SUMS

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "${NOTES_FILE}" ]; then
            cp -f "${NOTES_FILE}" /tmp/release-notes.md
            echo "has_curated=true" >> "${GITHUB_OUTPUT}"
          else
            python3 - "${GITHUB_REF_NAME}" <<'PY' > /tmp/release-notes.md
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          ver = tag[1:] if tag.startswith("v") else tag
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## \[{re.escape(ver)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, changelog)
          if match:
              print(match.group(0).strip())
          else:
              print(f"TermVR {tag}. See CHANGELOG.md for release details.")
          PY
            echo "has_curated=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Attest SLSA v1.0 Build Level 2 provenance
        id: attest
        if: github.event.repository.private != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/TermVR-${{ github.ref_name }}-arm64-v8a.apk
            release-assets/TermVR-${{ github.ref_name }}-x86_64.apk
            release-assets/TermVR-${{ github.ref_name }}.apks
            release-assets/TermVR-${{ github.ref_name }}.aab
            release-assets/SHA256SUMS

      - name: Append SLSA attestation links to release notes
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          REPO_FULL: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            printf '\n## Build provenance attestation\n\n'
            printf 'GitHub Actions generated SLSA v1.0 Build Level 2 provenance for every release artifact.\n\n'
            if [ -n "${ATTESTATION_URL}" ]; then
              printf -- '- **Release attestation record**: %s\n' "${ATTESTATION_URL}"
            fi
            printf -- '- **All repository attestations**: https://github.com/%s/attestations\n\n' "${REPO_FULL}"
            printf '```bash\n'
            printf 'gh attestation verify TermVR-%s-arm64-v8a.apk \\\n' "${TAG_NAME}"
            printf '  --repo %s \\\n' "${REPO_FULL}"
            printf '  --signer-workflow %s/.github/workflows/release-slsa.yml\n' "${REPO_FULL}"
            printf '```\n'
          } >> /tmp/release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "TermVR ${{ github.ref_name }}"
          body_path: /tmp/release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.has_curated != 'true' }}
          files: |
            release-assets/TermVR-${{ github.ref_name }}-arm64-v8a.apk
            release-assets/TermVR-${{ github.ref_name }}-x86_64.apk
            release-assets/TermVR-${{ github.ref_name }}.apks
            release-assets/TermVR-${{ github.ref_name }}.aab
            release-assets/SHA256SUMS

  publish-fdroid-repo:
    name: Publish Self-Hosted F-Droid Repo (gh-pages)
    needs:
      - attest-and-release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-fdroid-repo.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
