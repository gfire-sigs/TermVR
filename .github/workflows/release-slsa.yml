name: Release SLSA

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Deterministic APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apksigcopier ca-certificates cmake curl diffoscope git jq ninja-build python3 uidmap unzip xz-utils

      - name: Verify lockfile and F-Droid parity
        run: |
          set -euo pipefail
          python3 -m json.tool scripts/source-lock.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("scripts/source-lock.json").read_text(encoding="utf-8"))
          fdroid_text = Path("fdroid/dev.gfire.termvr.yml").read_text(encoding="utf-8")
          for key, meta in lock["sources"].items():
              expected = f"{key}@{meta['commit']}"
              assert expected in fdroid_text, f"Missing {expected} in fdroid/dev.gfire.termvr.yml"
          PY

      - name: Verify gvx version alignment against release tag
        run: ./scripts/sync-gvx-version.sh --check --expect-tag "${GITHUB_REF_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >
            platforms;android-36
            build-tools;36.1.0
            ndk;28.0.13004108
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'

      - name: Provision toolchains and vendor caches
        run: ./scripts/provision-toolchains-and-vendor.sh

      - name: Build offline native dependencies and unsigned release APK
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -r -n ./scripts/build-native-deps.sh --abi "${{ matrix.abi }}"
          GRADLE_EXE="$(command -v gradle)"
          if [ -x ./gradlew ]; then
            GRADLE_EXE="./gradlew"
          fi
          "${GRADLE_EXE}" --no-daemon :app:assembleRelease "-PtermvrAbis=${{ matrix.abi }}"

          BUILT_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "${BUILT_APK}"
          cp -f "${BUILT_APK}" "/tmp/unsigned-${{ matrix.abi }}.apk"

      - name: Verify clean-room unsigned APK reproducibility
        run: |
          set -euo pipefail
          CLEAN_DIR="/tmp/termvr-clean-repro-${{ matrix.abi }}"
          rm -rf "${CLEAN_DIR}"
          mkdir -p "${CLEAN_DIR}"
          git archive --format=tar HEAD | tar -xf - -C "${CLEAN_DIR}"
          ln -s "${PWD}/.toolchains" "${CLEAN_DIR}/.toolchains"
          GRADLE_EXE="$(command -v gradle)"
          if [ -x ./gradlew ]; then
            GRADLE_EXE="${CLEAN_DIR}/gradlew"
          fi
          (
            cd "${CLEAN_DIR}"
            unshare -r -n ./scripts/build-native-deps.sh --abi "${{ matrix.abi }}"
            "${GRADLE_EXE}" --no-daemon :app:assembleRelease "-PtermvrAbis=${{ matrix.abi }}"
          )
          CLEAN_APK="$(find "${CLEAN_DIR}/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"
          test -n "${CLEAN_APK}"
          cp -f "${CLEAN_APK}" "/tmp/clean-unsigned-${{ matrix.abi }}.apk"
          ./scripts/verify-reproducible-apk.sh \
            --unsigned-a "/tmp/unsigned-${{ matrix.abi }}.apk" \
            --unsigned-b "/tmp/clean-unsigned-${{ matrix.abi }}.apk"
          rm -rf "${CLEAN_DIR}"

      - name: Sign release APK and verify apksigcopier reproducibility
        env:
          TERMVR_RELEASE_KEYSTORE_B64: ${{ secrets.TERMVR_RELEASE_KEYSTORE_B64 }}
          TERMVR_RELEASE_KEY_ALIAS: ${{ secrets.TERMVR_RELEASE_KEY_ALIAS }}
          TERMVR_RELEASE_KEYSTORE_PASS: ${{ secrets.TERMVR_RELEASE_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          ABI="${{ matrix.abi }}"
          TAG_NAME="${GITHUB_REF_NAME}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="${SDK_ROOT}/build-tools/36.1.0/apksigner"
          UNSIGNED_APK="/tmp/unsigned-${ABI}.apk"
          CLEAN_UNSIGNED_APK="/tmp/clean-unsigned-${ABI}.apk"
          REPRO_SIGNED_APK="/tmp/repro-signed-${ABI}.apk"
          KEYSTORE_PATH="/tmp/termvr-release-${ABI}.p12"
          OUT_APK="dist/TermVR-${TAG_NAME}-${ABI}.apk"

          cleanup() {
            rm -f "${KEYSTORE_PATH}" "${UNSIGNED_APK}" "${CLEAN_UNSIGNED_APK}" "${REPRO_SIGNED_APK}"
          }
          trap cleanup EXIT

          mkdir -p dist

          if [ -n "${TERMVR_RELEASE_KEYSTORE_B64}" ]; then
            if [ -z "${TERMVR_RELEASE_KEY_ALIAS}" ] || [ -z "${TERMVR_RELEASE_KEYSTORE_PASS}" ]; then
              echo "TERMVR_RELEASE_KEY_ALIAS and TERMVR_RELEASE_KEYSTORE_PASS must be set when TERMVR_RELEASE_KEYSTORE_B64 is present" >&2
              exit 1
            fi
            printf '%s' "${TERMVR_RELEASE_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_PATH}"
            KEY_ALIAS="${TERMVR_RELEASE_KEY_ALIAS}"
            export SIGNING_PASS="${TERMVR_RELEASE_KEYSTORE_PASS}"
          else
            echo "TERMVR_RELEASE_KEYSTORE_B64 is empty; generating ephemeral fallback keystore in /tmp"
            KEY_ALIAS="termvr-ephemeral"
            export SIGNING_PASS="termvr-ephemeral-$(date +%s)-$$"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "${KEYSTORE_PATH}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 4096 -validity 365 \
              -dname "CN=TermVR Ephemeral Fork Build, OU=Android, O=gfire-sigs" \
              -storepass "${SIGNING_PASS}" \
              -keypass "${SIGNING_PASS}"
          fi

          "${APKSIGNER}" sign \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --alignment-preserved true \
            --ks "${KEYSTORE_PATH}" \
            --ks-type PKCS12 \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:SIGNING_PASS \
            --key-pass env:SIGNING_PASS \
            --out "${OUT_APK}" \
            "${UNSIGNED_APK}"

          "${APKSIGNER}" verify --verbose --print-certs "${OUT_APK}"

          apksigcopier copy "${OUT_APK}" "${CLEAN_UNSIGNED_APK}" "${REPRO_SIGNED_APK}"
          SHA_OUT="$(sha256sum "${OUT_APK}" | awk '{print tolower($1)}')"
          SHA_REPRO="$(sha256sum "${REPRO_SIGNED_APK}" | awk '{print tolower($1)}')"
          echo "Signed APK SHA-256:       ${SHA_OUT}"
          echo "apksigcopier APK SHA-256: ${SHA_REPRO}"
          if [ "${SHA_OUT}" != "${SHA_REPRO}" ]; then
            diffoscope "${OUT_APK}" "${REPRO_SIGNED_APK}" || true
            echo "apksigcopier signature transfer mismatch: ${SHA_OUT} != ${SHA_REPRO}" >&2
            exit 1
          fi

      - name: Verify 16 KB ELF alignment
        run: |
          ./scripts/verify-16kb-alignment.sh "dist/TermVR-${GITHUB_REF_NAME}-${{ matrix.abi }}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk-${{ matrix.abi }}
          path: dist/TermVR-${{ github.ref_name }}-${{ matrix.abi }}.apk

  attest-and-release:
    name: Attest SLSA Provenance and Publish Release
    needs:
      - build-apks
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download arm64-v8a APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk-arm64-v8a
          path: release-assets

      - name: Download x86_64 APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk-x86_64
          path: release-assets

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum "TermVR-${GITHUB_REF_NAME}-arm64-v8a.apk" "TermVR-${GITHUB_REF_NAME}-x86_64.apk" > SHA256SUMS
          cat SHA256SUMS

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "${NOTES_FILE}" ]; then
            cp -f "${NOTES_FILE}" /tmp/release-notes.md
            echo "has_curated=true" >> "${GITHUB_OUTPUT}"
          else
            python3 - "${GITHUB_REF_NAME}" <<'PY' > /tmp/release-notes.md
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          ver = tag[1:] if tag.startswith("v") else tag
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## \[{re.escape(ver)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, changelog)
          if match:
              print(match.group(0).strip())
          else:
              print(f"TermVR {tag}. See CHANGELOG.md for release details.")
          PY
            echo "has_curated=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Attest SLSA v1.0 Build Level 2 provenance
        if: github.event.repository.private != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/TermVR-${{ github.ref_name }}-arm64-v8a.apk
            release-assets/TermVR-${{ github.ref_name }}-x86_64.apk
            release-assets/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "TermVR ${{ github.ref_name }}"
          body_path: /tmp/release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.has_curated != 'true' }}
          files: |
            release-assets/TermVR-${{ github.ref_name }}-arm64-v8a.apk
            release-assets/TermVR-${{ github.ref_name }}-x86_64.apk
            release-assets/SHA256SUMS
